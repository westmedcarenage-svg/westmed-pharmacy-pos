<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Westmed POS Login</title><link rel="stylesheet" href="/static/styles.css"></head><body class="login-body"><div class="login-card"><div class="brand">WESTMED</div><h1>Pharmacy Management System</h1><p>Secure staff login</p>{% if error %}<div class="alert">{{ error }}</div>{% endif %}<form method="post"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Log in</button></form></div></body></html>
